name: Codex stable compatibility

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact rust-v* release tag
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      COLAY_TEST_FAKE_PROVIDERS_ONLY: "1"
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      report_name: ${{ steps.report.outputs.name }}
      asset_name: ${{ steps.asset.outputs.asset_name }}
      asset_sha256: ${{ steps.asset.outputs.asset_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve exact stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          fi
          [[ "$tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout exact upstream release
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" --filter=blob:none https://github.com/openai/codex.git "$RUNNER_TEMP/codex"
          git -C "$RUNNER_TEMP/codex" rev-parse HEAD | tee "$RUNNER_TEMP/upstream-sha.txt"
      - id: asset
        name: Download and verify official release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/codex-release-download"
          provenance="$RUNNER_TEMP/codex-release-provenance.json"
          mkdir -p "$download"
          gh release download "$TAG" --repo openai/codex \
            --pattern codex-package-x86_64-unknown-linux-musl.tar.gz \
            --pattern codex-package_SHA256SUMS \
            --dir "$download"
          python scripts/prepare_codex_release_asset.py \
            --archive "$download/codex-package-x86_64-unknown-linux-musl.tar.gz" \
            --checksums "$download/codex-package_SHA256SUMS" \
            --output "$RUNNER_TEMP/codex-release" \
            --provenance "$provenance"
          python - "$provenance" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          provenance_path, output_path = map(Path, sys.argv[1:])
          evidence = json.loads(provenance_path.read_text(encoding="utf-8"))
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"asset_name={evidence['asset_name']}\n")
              output.write(f"asset_sha256={evidence['asset_sha256']}\n")
          PY
      - name: Capture non-inference capability contract
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/report/$TAG"
          mkdir -p "$out/schema"
          codex_bin="$RUNNER_TEMP/codex-release/bin/codex"
          capture() {
            name="$1"
            shift
            set +e
            "$@" > "$out/$name" 2> "$out/$name.stderr"
            code="$?"
            set -e
            printf '%s\n' "$code" > "$out/$name.exit-code"
          }
          capture version-output.txt "$codex_bin" --version
          capture root-help.txt "$codex_bin" --help
          capture exec-help.txt "$codex_bin" exec --help
          capture exec-resume-help.txt "$codex_bin" exec resume --help
          capture app-server-help.txt "$codex_bin" app-server --help
          set +e
          "$codex_bin" app-server generate-json-schema --out "$out/schema" \
            > "$out/app-server-schema.stdout" 2> "$out/app-server-schema.stderr"
          schema_code="$?"
          set -e
          printf '%s\n' "$schema_code" > "$out/app-server-schema.exit-code"
          python - \
            "$TAG" \
            "$(cat "$RUNNER_TEMP/upstream-sha.txt")" \
            "$RUNNER_TEMP/codex-release-provenance.json" \
            "$out/report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          tag, commit, provenance_path, report_path = sys.argv[1:]
          report = json.loads(Path(provenance_path).read_text(encoding="utf-8"))
          report.update(
              {
                  "tag": tag,
                  "commit": commit,
                  "inference_executed": False,
              }
          )
          Path(report_path).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
      - name: Build actionable compatibility report
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python scripts/build_compat_report.py \
            --capture "$RUNNER_TEMP/report/$TAG" \
            --matrix compatibility/codex-matrix.json \
            --fixtures fixtures/codex/versions \
            --subject "$TAG" \
            --revision "$(cat "$RUNNER_TEMP/upstream-sha.txt")" \
            --kind release
          find "$RUNNER_TEMP/report/$TAG" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/report/$TAG/SHA256SUMS"
      - name: Run orchestrator contract tests
        run: cargo test -p codex-compat -p orchestrator-state -p orchestrator-test-support
      - id: report
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: echo "name=codex-compat-${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report.outputs.name }}
          path: ${{ runner.temp }}/report
          if-no-files-found: error

  publish-draft-report:
    if: ${{ vars.PUBLISH_COMPAT_REPORT == 'true' }}
    needs: inspect
    runs-on: ubuntu-latest
    env:
      CODEX_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.inspect.outputs.report_name }}
          path: compatibility/reports/${{ needs.inspect.outputs.tag }}
      - name: Publish whitelisted report as draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="compat/codex-${TAG}-${RUN_ID}"
          git switch -c "$branch"
          git add "compatibility/reports/$TAG"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Report Codex $TAG compatibility"
          git push origin "$branch"
          gh pr create --draft --title "Codex $TAG compatibility report" --body "Automated non-inference compatibility report. No provider credentials were available to the inspection job."
